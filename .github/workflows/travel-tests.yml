name: Travel tests
on:
  pull_request:
    paths:
      - 'travel.py'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/travel-tests.yml'
  push:
    branches: [main]
    paths:
      - 'travel.py'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/travel-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  travel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies (no production Secrets)
        run: python -m pip install -r requirements-test.txt
      - name: Run travel tests (never starts travel.py)
        run: python -B -m unittest discover -q -s tests -p "test_*.py"
